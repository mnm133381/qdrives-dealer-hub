<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08080A" />
  <title>Offline · QD Auctions</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #08080A; color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
    .logo { width: 96px; height: 96px; border-radius: 24px; background: #11111A; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 8px 24px rgba(185, 28, 28, 0.18); }
    .logo img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.01em; }
    p { color: #A3A3A3; margin: 0 0 24px; font-size: 15px; line-height: 1.5; max-width: 340px; }
    button { background: #B91C1C; color: white; border: 0; border-radius: 12px; padding: 14px 24px; font-size: 15px; font-weight: 600; min-height: 48px; min-width: 160px; cursor: pointer; box-shadow: 0 4px 12px rgba(185, 28, 28, 0.3); }
    button:active { transform: scale(0.98); }
    .hint { color: #525252; font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="/icons/icon-192.png" alt="QD Auctions" /></div>
    <h1>You're offline</h1>
    <p>Looks like your connection dropped. Live bidding needs the internet — reconnect and we'll pick up right where you left off.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">QD Auctions · Cached for offline use</div>
  </div>
</body>
</html>
